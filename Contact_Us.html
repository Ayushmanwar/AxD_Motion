<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | AxD_Motion</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

<div style="text-align: center; margin-top: 50px; margin-bottom: 5px;">
    <a href="AxD_motion.html">
        <img src="Images/logo.png" alt="AxD_Motion" style="width: 350px; max-width: 80%;">
    </a>
</div>

<div style="text-align: center;">
    <a style="padding-right: 20px;" href="Portfolio.html">Portfolio</a>
    <a style="padding-right: 20px;" href="index.html">Home</a>
    <a style="padding-right: 20px;" href="Backstage.html">Backstage</a>
</div>

<h1 style="text-align: center;">Contact Us</h1>

<p style="text-align: center; font-size: 20px; line-height: 30px;">
    Have a question or want to get in touch?<br>
    Feel free to send me a message.
</p>

<div style="text-align: center; margin-top: 35px;">
    <p>Email: <a href="mailto:axdmotion@gmail.com">axdmotion@gmail.com</a></p>
</div>

<div style="width: min(450px, 90%); margin: 35px auto;">
    <form id="contactForm">
        <p>
            <label for="name">Your Name</label><br>
            <input type="text" id="name" name="name" required
                   style="width: 100%; padding: 10px; box-sizing: border-box;">
        </p>

        <p>
            <label for="email">Your Email</label><br>
            <input type="email" id="email" name="email" required
                   style="width: 100%; padding: 10px; box-sizing: border-box;">
        </p>

        <p>
            <label for="subject">Subject</label><br>
            <input type="text" id="subject" name="subject" required
                   style="width: 100%; padding: 10px; box-sizing: border-box;">
        </p>

        <p>
            <label for="message">Your Message</label><br>
            <textarea id="message" name="message" rows="6" required
                      style="width: 100%; padding: 10px; box-sizing: border-box;"></textarea>
        </p>

        <div style="text-align: center;">
            <button type="submit"
                    style="background-color: purple; color: white; padding: 15px 35px; border: 0; cursor: pointer;">
                Send Message
            </button>
        </div>
    </form>
</div>

<script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const subject = document.getElementById("subject").value.trim();
        const message = document.getElementById("message").value.trim();

        const body =
            "Name: " + name + "\n" +
            "Email: " + email + "\n\n" +
            "Message:\n" + message;

        const gmailCompose =
            "https://mail.google.com/mail/?view=cm&fs=1" +
            "&to=" + encodeURIComponent("axdmotion@gmail.com") +
            "&su=" + encodeURIComponent(subject) +
            "&body=" + encodeURIComponent(body);

        window.open(gmailCompose, "_blank");
    });
</script>

</body>
</html>
